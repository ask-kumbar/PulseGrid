[project]
name = "pulsegrid"
version = "0.1.0"
description = "Distributed real-time IoT telemetry ingestion pipeline"
requires-python = ">=3.12"
dependencies = [
  "aiokafka>=0.12,<1.0",
  "asyncpg>=0.30,<1.0",
  "fastapi>=0.115,<1.0",
  "httpx>=0.28,<1.0",
  "pydantic>=2.10,<3.0",
  "protobuf>=7.35.1,<8.0",
  "python-dotenv>=1.0,<2.0",
  "redis>=5.2,<6.0",
  "uvicorn[standard]>=0.34,<1.0",
]

[project.optional-dependencies]
dev = [
  "grpcio-tools>=1.70,<2.0",
  "pytest>=8.3,<9.0",
  "pytest-asyncio>=0.25,<2.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools]
packages = ["generated", "services", "services.ingestion_api", "services.query_api", "services.telemetry_processor", "services.device_simulator"]
